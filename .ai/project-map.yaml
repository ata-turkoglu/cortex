{
  "version": 1,
  "repository": "Cortex",
  "entrypoints": ["AGENTS.md", "codex-prompts/MASTER_PROMPT.md", "codex-prompts/docs/DECISIONS.md"],
  "context_excluded": ["data", "node_modules", ".pnpm-store", ".venv", "frontend/dist", "frontend/src/api/generated", "reports/licenses"],
  "scoped_adapters": [
    "backend",
    "backend/app/query",
    "backend/app/query/context",
    "backend/app/query/understanding",
    "backend/app/query/ir",
    "backend/app/query/planning",
    "backend/app/query/orchestration",
    "backend/app/knowledge",
    "backend/app/knowledge/graph",
    "backend/app/knowledge/entities",
    "backend/app/knowledge/relations",
    "backend/app/knowledge/events",
    "backend/app/knowledge/temporal",
    "backend/app/knowledge/claims",
    "backend/app/knowledge/provenance",
    "backend/app/engines",
    "backend/app/engines/structured",
    "backend/app/engines/graph",
    "backend/app/engines/hybrid",
    "backend/app/retrieval",
    "backend/app/graphrag",
    "backend/app/reasoning",
    "backend/app/reasoning/research",
    "backend/app/reasoning/composition"
  ],
  "modules": [
    {"path": "frontend", "context": "frontend/AGENTS.md", "docs": ["docs/frontend/README.md", "docs/api/contract.md", "docs/architecture/query-answer-pipeline.md", "docs/architecture/system-map-index.md"]},
    {"path": "backend", "context": "backend/AGENTS.md", "docs": ["docs/architecture/backend-foundation.md", "docs/api/contract.md"]},
    {"path": "backend/app/query", "context": "backend/app/query/AGENTS.md", "docs": ["docs/architecture/query-v2/query-runtime.md", "docs/architecture/query-v2/repository-boundaries.md"]},
    {"path": "backend/app/query/planning", "context": "backend/app/query/planning/AGENTS.md", "docs": ["docs/architecture/query-v2/execution-planning.md", "docs/architecture/query-v2/query-runtime.md"]},
    {"path": "backend/app/query/orchestration", "context": "backend/app/query/orchestration/AGENTS.md", "docs": ["docs/architecture/query-v2/result-evidence-layer.md", "docs/architecture/query-v2/query-runtime.md"]},
    {"path": "backend/app/knowledge", "context": "backend/app/knowledge/AGENTS.md", "docs": ["docs/architecture/query-v2/knowledge-construction.md", "docs/architecture/query-v2/repository-boundaries.md"]},
    {"path": "backend/app/engines", "context": "backend/app/engines/AGENTS.md", "docs": ["docs/architecture/query-v2/query-runtime.md", "docs/architecture/query-v2/repository-boundaries.md"]},
    {"path": "backend/app/engines/structured", "context": "backend/app/engines/structured/AGENTS.md", "docs": ["docs/architecture/query-v2/structured-graph-engines.md", "docs/architecture/query-v2/result-evidence-layer.md"]},
    {"path": "backend/app/engines/graph", "context": "backend/app/engines/graph/AGENTS.md", "docs": ["docs/architecture/query-v2/structured-graph-engines.md", "docs/architecture/query-v2/knowledge-construction.md"]},
    {"path": "backend/app/reasoning", "context": "backend/app/reasoning/AGENTS.md", "docs": ["docs/architecture/query-v2/reasoning-composition.md", "docs/architecture/query-v2/query-runtime.md", "docs/architecture/query-v2/repository-boundaries.md"]},
    {"path": "backend/app/retrieval", "context": "backend/app/retrieval/AGENTS.md", "docs": ["docs/architecture/retrieval-boundaries.md"]},
    {"path": "backend/app/graphrag", "context": "backend/app/graphrag/AGENTS.md", "docs": ["docs/architecture/graphrag-boundary.md"]},
    {"path": "backend/app/workflows", "context": "backend/app/workflows/AGENTS.md", "docs": ["docs/workflows/durable-workflows.md"]},
    {"path": "infrastructure", "context": "infrastructure/AGENTS.md", "docs": ["docs/architecture/deployment.md"]}
  ],
  "documentation_rules": {
    "public_contract_change_requires": ["docs/api/contract.md"],
    "architecture_change_requires": ["docs/architecture/README.md"],
    "workflow_change_requires": ["docs/workflows/durable-workflows.md"]
  }
}
