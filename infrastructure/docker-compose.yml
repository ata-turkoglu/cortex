services:
  redis:
    image: redis:7.4.2-alpine3.21
    ports: ["6379:6379"]
  qdrant:
    image: qdrant/qdrant:v1.13.2
    ports: ["6333:6333"]
    volumes: ["../data/qdrant:/qdrant/storage"]
  neo4j:
    image: neo4j:2026.07.1
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${CORTEX_NEO4J_PASSWORD:-cortex-local-neo4j}
    volumes: ["../data/neo4j:/data"]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          cypher-shell -u neo4j -p "$${NEO4J_AUTH#*/}" "RETURN 1"
          >/dev/null 2>&1 || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  ollama:
    image: ollama/ollama@sha256:b88c73ace3e115f8ec53dc8761ae1c0aabfa675406e3681786b98757ce050f42
    container_name: cortex-ollama
    environment:
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
    ports: ["127.0.0.1:11434:11434"]
    volumes: ["cortex-ollama-models:/root/.ollama"]
    healthcheck:
      # `ollama list` uses the service's /api/tags endpoint; the image has no curl/wget binary.
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
  ollama-models:
    image: ollama/ollama@sha256:b88c73ace3e115f8ec53dc8761ae1c0aabfa675406e3681786b98757ce050f42
    container_name: cortex-ollama-models
    environment:
      OLLAMA_HOST: http://ollama:11434
      CORTEX_OLLAMA_REQUIRED_MODELS: ${CORTEX_OLLAMA_REQUIRED_MODELS:-bge-m3:latest}
    entrypoint: ["/bin/sh", "/bootstrap/ollama-bootstrap.sh"]
    volumes:
      - "./ollama-bootstrap.sh:/bootstrap/ollama-bootstrap.sh:ro"
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
volumes:
  cortex-ollama-models:
    name: cortex_ollama_models
