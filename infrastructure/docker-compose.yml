services:
  frontend:
    image: node:24.0.2-alpine3.21
    working_dir: /app/frontend
    command: sh -c "corepack pnpm install --frozen-lockfile && corepack pnpm dev --host 0.0.0.0"
    ports: ["3000:5173"]
    environment:
      VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET:-http://backend:8000}
    volumes:
      - "../:/app"
      - "frontend-node-modules:/app/node_modules"
      - "frontend-package-node-modules:/app/frontend/node_modules"
  backend:
    build: { context: .., dockerfile: backend/Dockerfile, target: runtime }
    ports: ["4000:8000"]
    environment:
      TZ: Europe/Istanbul
      CORTEX_DATABASE_URL: sqlite:////data/sqlite/cortex.db
      CORTEX_DATA_PATH: /data
      CORTEX_REDIS_URL: redis://redis:6379/0
      CORTEX_QDRANT_URL: http://qdrant:6333
      CORTEX_NEO4J_URI: bolt://neo4j:7687
      CORTEX_NEO4J_DATABASE: neo4j
      CORTEX_NEO4J_USERNAME: neo4j
      CORTEX_NEO4J_PASSWORD: ${CORTEX_NEO4J_PASSWORD:-cortex-local-neo4j}
      CORTEX_OLLAMA_BASE_URL: http://host.docker.internal:11434
      CORTEX_SECRET_STORE_PATH: /data/secrets
      CORTEX_OPENAI_API_KEY: ${CORTEX_OPENAI_API_KEY:-}
      CORTEX_ANTHROPIC_API_KEY: ${CORTEX_ANTHROPIC_API_KEY:-}
    volumes: ["../data:/data"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      redis: { condition: service_started }
      qdrant: { condition: service_started }
      neo4j: { condition: service_healthy }
    stop_grace_period: 30s
  worker:
    build: { context: .., dockerfile: backend/Dockerfile, target: worker }
    command: uv run --frozen --no-sync dramatiq app.workers
    environment:
      TZ: Europe/Istanbul
      CORTEX_DATABASE_URL: sqlite:////data/sqlite/cortex.db
      CORTEX_DATA_PATH: /data
      CORTEX_REDIS_URL: redis://redis:6379/0
      CORTEX_QDRANT_URL: http://qdrant:6333
      CORTEX_NEO4J_URI: bolt://neo4j:7687
      CORTEX_NEO4J_DATABASE: neo4j
      CORTEX_NEO4J_USERNAME: neo4j
      CORTEX_NEO4J_PASSWORD: ${CORTEX_NEO4J_PASSWORD:-cortex-local-neo4j}
      CORTEX_OLLAMA_BASE_URL: http://host.docker.internal:11434
      CORTEX_SECRET_STORE_PATH: /data/secrets
      CORTEX_OPENAI_API_KEY: ${CORTEX_OPENAI_API_KEY:-}
      CORTEX_ANTHROPIC_API_KEY: ${CORTEX_ANTHROPIC_API_KEY:-}
    volumes: ["../data:/data"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      redis: { condition: service_started }
      qdrant: { condition: service_started }
      neo4j: { condition: service_healthy }
    stop_grace_period: 30s
  redis:
    image: redis:7.4.2-alpine3.21
    ports: ["6379:6379"]
  qdrant:
    image: qdrant/qdrant:v1.13.2
    ports: ["6333:6333"]
    volumes: ["../data/qdrant:/qdrant/storage"]
  neo4j:
    image: neo4j:2026.07.1
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${CORTEX_NEO4J_PASSWORD:-cortex-local-neo4j}
    volumes: ["../data/neo4j:/data"]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          cypher-shell -u neo4j -p "$${NEO4J_AUTH#*/}" "RETURN 1"
          >/dev/null 2>&1 || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
volumes:
  frontend-node-modules:
  frontend-package-node-modules:
